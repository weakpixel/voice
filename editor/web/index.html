<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="version" content="__VERSION__">
  <title>Voice Editor</title>
  <link rel="stylesheet" href="style.css?v=__VERSION__">
  <script src="wasm_exec.js?v=__VERSION__"></script>
  <script type="module" src="app.js?v=__VERSION__"></script>
</head>
<body>
  <header class="bar">
    <h1>Voice Editor</h1>
    <span id="doc-name" class="doc-name"></span>
    <div class="spacer"></div>
    <label class="button" title="Start a new voice from a starter voice">
      <span class="icon" style="--icon: url(icons/plus.svg)"></span>
      <select id="starter" aria-label="New from starter">
        <option value="">New from starter…</option>
      </select>
    </label>
    <button id="open" type="button" title="Open a .voice.json file (or drop one on the page)">
      <span class="icon" style="--icon: url(icons/upload.svg)"></span>Open
    </button>
    <button id="download" type="button" title="Download the voice as a .voice.json file">
      <span class="icon" style="--icon: url(icons/download.svg)"></span>Download
    </button>
    <button id="undo" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button id="redo" type="button" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
    <button id="copy" type="button" title="Copy the voice JSON to the clipboard">
      <span class="icon" style="--icon: url(icons/copy.svg)"></span>Copy
    </button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </header>

  <main class="layout">
    <section class="panel editor" aria-label="Voice file">
      <div class="panel-head">
        <div class="tabs" role="tablist" aria-label="View">
          <button id="tab-visual" type="button" role="tab" class="tab" data-view="visual">Visual</button>
          <button id="tab-source" type="button" role="tab" class="tab" data-view="source">Source</button>
        </div>
        <span id="validity" class="validity"></span>
      </div>
      <div id="visual" class="visual" role="tabpanel" aria-labelledby="tab-visual" hidden></div>
      <textarea id="doc" spellcheck="false" autocomplete="off" aria-label="Voice JSON" role="tabpanel" aria-labelledby="tab-source"></textarea>
    </section>

    <section class="panel preview" aria-label="Preview">
      <div class="panel-head"><h2>Preview</h2><span id="audio-state" class="audio-state">Audio starts on the first click</span></div>
      <label class="field">Test line
        <input id="line" type="text" value="Hello there, traveler! Are you lost?">
      </label>
      <div class="transport">
        <button id="play" type="button" class="primary"><span class="icon" style="--icon: url(icons/player-play.svg)"></span>Play</button>
        <button id="pause" type="button" disabled><span class="icon" style="--icon: url(icons/player-pause.svg)"></span><span class="label">Pause</span></button>
        <button id="skip" type="button" disabled><span class="icon" style="--icon: url(icons/player-track-next.svg)"></span>Skip</button>
        <button id="stop" type="button" disabled><span class="icon" style="--icon: url(icons/player-stop.svg)"></span>Stop</button>
        <button id="wav" type="button" title="Download the test line as a WAV sound file"><span class="icon" style="--icon: url(icons/download.svg)"></span>WAV</button>
        <label class="check" title="Play the line again after an edit (instrument edits are heard live while it plays)"><input id="replay" type="checkbox" checked> Replay on change</label>
        <label class="volume" title="Volume"><span class="icon" style="--icon: url(icons/volume.svg)"></span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </label>
      </div>
      <div class="typewriter" id="typewriter" aria-live="polite"><span id="shown"></span><span id="hidden" class="hidden-text"></span></div>
      <div class="lanes">
        <canvas id="roll" title="The line's notes: one row per semitone, coloured by instrument; drums in the band at the bottom; ticks at the top where the text moves on"></canvas>
        <canvas id="wave" title="The sound of the line as rendered (with the reverb ringing out)"></canvas>
        <div class="legend" aria-hidden="true">
          <span style="--c: var(--inst-vowel)">vowel</span><span style="--c: var(--inst-sonorant)">sonorant</span><span style="--c: var(--inst-fricative)">fricative</span><span style="--c: var(--inst-plosive)">plosive</span><span style="--c: var(--inst-motif)">motif</span><span style="--c: var(--inst-percussion)">drums</span>
        </div>
      </div>
      <div class="meter" aria-hidden="true"><div id="meter-bar" class="meter-bar"></div></div>
      <div class="status-line"><span id="time">0.00 s</span> <span id="events"></span></div>
      <h3>Problems</h3>
      <ul id="problems" class="problems"><li class="none">None</li></ul>
    </section>
  </main>
  <div id="drop" class="drop" hidden>Drop a .voice.json file to open it</div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
